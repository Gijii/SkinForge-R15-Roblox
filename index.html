<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Editor avanzado 3D de ropa para Roblox.">
    <meta name="theme-color" content="#07090c">
    <title>Roblox Skin Crafter Pro | Editor 3D</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <header role="banner">
        <nav class="navbar">
            <a href="#" class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
                Roblox<span>Crafter 3D</span>
            </a>
            <div class="nav-links">
                <a href="#herramienta">Herramienta</a>
                <a href="#guia">Guía de Uso</a>
            </div>
        </nav>
    </header>

    <nav class="step-nav">
        <div class="step-nav-item active" id="s1">
            <div class="step-nav-circle">1</div>
            <span>IMAGEN</span>
        </div>
        <div class="step-nav-line" id="l1"></div>
        <div class="step-nav-item" id="s2">
            <div class="step-nav-circle">2</div>
            <span>CAPAS 3D</span>
        </div>
        <div class="step-nav-line" id="l2"></div>
        <div class="step-nav-item" id="s3">
            <div class="step-nav-circle">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
            </div>
            <span>EXPORTAR</span>
        </div>
    </nav>

    <main class="container" id="herramienta">
        <div class="app-grid">
            
            <section class="panel canvas-container">
                <header class="canvas-header">
                    <h2>Previsualización 3D (R15)</h2>
                    <span class="badge">Arrastra para rotar</span>
                </header>
                <div id="container3D" style="width: 100%; height: 559px; background: #1a1d24; border-radius: 12px; cursor: grab; overflow: hidden; border: 2px solid var(--border-light);"></div>
                <canvas id="canvasRoblox" width="585" height="559" style="display:none;"></canvas>
            </section>

            <aside class="panel controls-panel">
                <h3 class="panel-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                    Gestor de Texturas
                </h3>
                
                <div id="uploadSection">
                    <label for="subirImagen" class="upload-area" id="dropZone">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        <p class="main-text">Arrastra tu textura aquí</p>
                    </label>
                    <input type="file" id="subirImagen" accept="image/png, image/jpeg" style="display:none">
                    <button type="button" class="btn btn-primary" id="btnAddLayer">➕ Añadir Capa</button>
                </div>

                <div id="layersContainer" class="layers-manager">
                    <p class="sub-text">Capas Activas:</p>
                    <ul id="layersList" class="layers-list"></ul>
                </div>

                <div id="adjustmentsPanel" class="adjustments-wrapper hidden">
                    <div class="adjustment-group scrollable-adjustments">
                        
                        <div class="adjustment-row">
                            <label>TAMAÑO PROPORCIONAL</label>
                            <span class="val" id="scaleV">100%</span>
                        </div>
                        <input type="range" id="scaleS" min="10" max="300" value="100" class="slider-control">

                        <div class="adjustment-row">
                            <label>MOVER ↔️ (X)</label>
                            <span class="val" id="xV">0</span>
                        </div>
                        <input type="range" id="xS" min="-500" max="500" value="0" class="slider-control">

                        <div class="adjustment-row">
                            <label>MOVER ↕️ (Y)</label>
                            <span class="val" id="yV">0</span>
                        </div>
                        <input type="range" id="yS" min="-500" max="500" value="0" class="slider-control">

                    </div>

                    <div class="action-buttons">
                        <button type="button" class="btn btn-cyan" id="btnDescargar">🚀 Descargar Textura Final</button>
                        <button type="button" class="btn btn-outline" id="btnReset">🔄 Reiniciar</button>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <footer>
        <p>Roblox Crafter Pro 3D © 2026 | Sistema de Modelado y Texturas Avanzadas.</p>
    </footer>

    <script src="script.js" defer></script>
</body>
</html>
